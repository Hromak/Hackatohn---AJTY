# Lokální spuštění pro vývoj: docker compose up
# Služba poběží na http://localhost:8000 (jen z tohoto počítače), token ukázkového týmu je "demo".
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ZAPI_DEMO: "1"
      ZAPI_DEMO_TOKEN: "demo"
    volumes:
      - zapi-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  zapi-data:
